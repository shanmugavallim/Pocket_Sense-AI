<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings - PocketSense AI</title>

    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
</head>

<body>

    <h1>Savings Goal</h1>

    <form method="post" action="/savings">

        <label>Savings Goal</label>
        <input
            type="text"
            name="goal"
            placeholder="Example: New Laptop"
            required
        >

        <label>Target Amount</label>
        <input
            type="number"
            name="target_amount"
            placeholder="Example: 50000"
            step="0.01"
            required
        >

        <label>Already Saved Amount</label>
        <input
            type="number"
            name="saved_amount"
            placeholder="Example: 10000"
            step="0.01"
            required
        >

        <button type="submit">Save Goal</button>

    </form>

    <h2>Current Savings Goal</h2>

    {% if savings %}

        <p>Goal: {{ savings.goal }}</p>

        <p>Target Amount: ₹{{ savings.target_amount }}</p>

        <p>Saved Amount: ₹{{ savings.saved_amount }}</p>

        <p>
            Remaining Amount:
            ₹{{ savings.target_amount - savings.saved_amount }}
        </p>

    {% else %}

        <p>No savings goal set yet.</p>

    {% endif %}

</body>
</html>
